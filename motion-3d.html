<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>손동작 3D 안내</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#162536;font-family:system-ui,sans-serif}header{display:flex;justify-content:space-around;padding:15px;font-weight:700}#scene{height:330px;position:relative}canvas{display:block;width:100%;height:100%}footer{padding:12px 18px}#action{font-size:15px;font-weight:650;margin:0 0 12px}.controls{display:flex;align-items:center;gap:12px}button{flex-shrink:0;white-space:nowrap;padding:10px 18px;background:#142437;color:white;border:0;border-radius:22px;min-height:44px;cursor:pointer}input{width:100%;accent-color:#142437}small{display:block;color:#596b7d;margin-top:10px}#error{padding:20px}@media(max-width:450px){#scene{height:360px}header{font-size:14px}footer{padding:12px}}</style><header><span>손동작</span><span>→</span><span>로봇팔 반응</span></header><div id="scene"></div><footer><p id="action"></p><div class="controls"><button id="play" aria-pressed="true">일시정지</button><input id="progress" type="range" min="0" max="100" value="0" aria-label="손동작 직접 조절"></div><small>슬라이더로 천천히 움직여보세요. 노란색은 선택한 관절입니다.</small></footer><script type="module" src="./motion-3d.js"></script></html>
